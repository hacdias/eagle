services:
  caddy:
    container_name: caddy
    image: caddy
    ports:
      - "8045:8045"
    volumes:
      - ./testing/storage:/www
    command: "caddy file-server --browse --root /www --listen :8045"
  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.56
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
