{{ template "_header.html" . }}
{{ template "_navigation.html" "editor" }}

<main>
  <h1>Editing <code>{{ .Path }}</code></h1>

  {{ if .Success }}
  <p class='notice'>
    <strong>✅ Success!</strong>
  </p>
  {{ end }}

  <form method='post' class='stack'>
    <textarea name='content' class='content-input'>{{ .Content }}</textarea>

    {{ if .IsEntry }}
      {{ template "_syndicators.html" .Syndicators }}
    {{ end }}

    <button>Save</button>
  </form>
</main>

{{ template "_footer.html" . }}
